<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6.1 Banner Manager</title><style>
:root{--r:#ef1018;--b:#111;--s:#f4f5f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--s);color:#222}.wrap{max-width:980px;margin:40px auto;padding:0 18px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.1);margin-bottom:18px}h1{margin:0 0 8px}.notice{background:#fff4d6;border:1px solid #f0c35a;padding:14px;border-radius:12px;line-height:1.6}.row{display:grid;grid-template-columns:1.2fr 2fr 1fr .7fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--r);color:#fff}.dark{background:#111;color:#fff}.ghost{background:#eee}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}pre{white-space:pre-wrap;background:#111;color:#eee;padding:15px;border-radius:12px;max-height:260px;overflow:auto}@media(max-width:760px){.row{grid-template-columns:1fr}.row:first-child{display:none}}
</style></head><body><div class="wrap"><div class="card"><h1>V6.1 Banner Manager</h1><p>管理轮播图片路径、链接、顺序与启用状态。</p><div class="notice"><b>重要：</b>GitHub Pages 是静态网站，不能直接在浏览器永久写入服务器。这个页面会生成新的 <code>banners.json</code>。下载后上传并覆盖仓库的 <code>content/banners.json</code>，网站就会自动更新。真正“一键发布”需要另外配置 GitHub OAuth/Decap CMS。</div></div><div class="card"><div id="rows"></div><div class="actions"><button class="btn ghost" id="add">＋ 新增 Banner</button><button class="btn primary" id="download">下载 banners.json</button><a class="btn dark" href="https://github.com/tunetalkmelaka/tunetalkservice/upload/main/content" target="_blank" rel="noopener">打开 GitHub 上传页面</a><a class="btn ghost" href="../">返回网站</a></div></div><div class="card"><h3>预览 JSON</h3><pre id="preview"></pre></div></div><script>
let data=[];const rows=document.getElementById('rows'),preview=document.getElementById('preview');
function render(){rows.innerHTML='<div class="row"><b>标题</b><b>图片路径</b><b>链接</b><b>顺序/启用</b><b></b></div>'+data.map((x,i)=>`<div class="row"><input data-k="title" data-i="${i}" value="${x.title||''}"><input data-k="image" data-i="${i}" value="${x.image||''}"><input data-k="link" data-i="${i}" value="${x.link||''}"><div><input data-k="order" data-i="${i}" type="number" value="${x.order||i+1}" style="width:70px"><label><input data-k="enabled" data-i="${i}" type="checkbox" ${x.enabled!==false?'checked':''}>启用</label></div><button class="btn ghost" onclick="removeRow(${i})">删除</button></div>`).join('');preview.textContent=JSON.stringify(data,null,2);rows.querySelectorAll('input').forEach(el=>el.oninput=()=>{let v=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;data[+el.dataset.i][el.dataset.k]=v;preview.textContent=JSON.stringify(data,null,2)});}
window.removeRow=i=>{data.splice(i,1);render()};document.getElementById('add').onclick=()=>{data.push({title:'New Banner',image:'images/banner-new.png',alt:'TuneTalk promotion banner',link:'#plans',order:data.length+1,enabled:true});render()};document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='banners.json';a.click();URL.revokeObjectURL(a.href)};fetch('../content/banners.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j;render()}).catch(()=>{data=[];render()});
</script></body></html>
